name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build XPI
        run: npm run build

      - name: Verify XPI contents
        run: |
          XPI=$(ls build/*.xpi)
          echo "Built: $XPI"
          unzip -l "$XPI"
          # Ensure the essential files are packaged
          unzip -l "$XPI" | grep -q "manifest.json"
          unzip -l "$XPI" | grep -q "bootstrap.js"
          unzip -l "$XPI" | grep -q "content/scripts/jec.js"
          unzip -l "$XPI" | grep -q "content/preferences.xhtml"
          # The build should also generate the Zotero update manifest
          test -f .scaffold/build/update.json
          echo "XPI verification passed"

      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: just-enough-color-xpi
          path: build/*.xpi
          if-no-files-found: error
